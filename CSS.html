<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS.QUIZ</title>
</head>
<body>

    <div class="onee">
    <div class="one">
        <pre>  </pre>
        <h2 class="two">Welcome you here to attend the CSS Programming Language</h2>

        <h2 id="question" class="twoo">Question Text</h2>

        <ul class="options">
            <li>
                <input type="radio" name="answer" id="a" class="answer">
                <label for="a" id="a_text">Answer</label>

            </li>

            <li>
                <input type="radio" name="answer" id="b" class="answer">
                <label for="b" id="b_text">Answer</label>

            </li>

            <li>
                <input type="radio" name="answer" id="c" class="answer">
                <label for="c" id="c_text">Answer</label>

            </li>

            <li>
                <input type="radio" name="answer" id="d" class="answer">
                <label for="d" id="d_text">Answer</label>

            </li>
        </ul>

        <div id="feedback" class="feedback"></div>

        <button id="submit">Next</button>


    </div>
    </div>

    <script>
        const quizData=[
            {
    question: "What does CSS stand for?",
    a: "Cascading Style Sheets",
    b: "Computer Style Sheets",
    c: "Creative Style System",
    d: "Colorful Style Sheets",
    correct: "a"
  },
  {
    question: "Which HTML tag is used to link an external CSS file?",
    a: "<css>",
    b: "<style>",
    c: "<link>",
    d: "<script>",
    correct: "c"
  },
  {
    question: "How do you select an element with id 'header' in CSS?",
    a: ".header",
    b: "#header",
    c: "header",
    d: "*header",
    correct: "b"
  },
  {
    question: "Which property is used to change the background color?",
    a: "background-color",
    b: "color",
    c: "bgcolor",
    d: "backgroundImage",
    correct: "a"
  },
  {
    question: "How do you make the text bold in CSS?",
    a: "font-weight: bold;",
    b: "text-style: bold;",
    c: "font-style: bold;",
    d: "text-decoration: bold;",
    correct: "a"
  },
  {
    question: "Which property controls the text size?",
    a: "font-style",
    b: "text-size",
    c: "font-size",
    d: "text-style",
    correct: "c"
  },
  {
    question: "How do you add a comment in CSS?",
    a: "// this is a comment",
    b: "/* this is a comment */",
    c: "<!-- this is a comment -->",
    d: "' this is a comment",
    correct: "b"
  },
  {
    question: "Which property is used to change the text color?",
    a: "fgcolor",
    b: "color",
    c: "text-color",
    d: "font-color",
    correct: "b"
  },
  {
    question: "What does the 'float' property do?",
    a: "Moves elements to the left or right",
    b: "Changes font style",
    c: "Adds a floating animation",
    d: "Adjusts element opacity",
    correct: "a"
  },
  {
    question: "How do you center-align text using CSS?",
    a: "text-align: center;",
    b: "align: center;",
    c: "center-text: true;",
    d: "text-center: yes;",
    correct: "a"
  }

        ];

         const questionEl = document.getElementById("question");
const answerEls = document.querySelectorAll(".answer");
const a_text = document.getElementById("a_text");
const b_text = document.getElementById("b_text");
const c_text = document.getElementById("c_text");
const d_text = document.getElementById("d_text");
const submitBtn = document.getElementById("submit");
const feedbackEl = document.getElementById("feedback");

let currentQuiz = 0;
let score = 0;
let answered = false;

loadQuiz();



     function loadQuiz() {
    deselectAnswers();
    feedbackEl.innerHTML = "";

    answerEls.forEach(el => {
        el.disabled = false;
        const label = document.getElementById(el.id + "_text");
        label.classList.remove("correct", "wrong");
        label.textContent = "";   
    });

    const currentQuizData = quizData[currentQuiz];
    questionEl.innerText = currentQuizData.question;
    a_text.textContent = currentQuizData.a;
    b_text.textContent = currentQuizData.b;
    c_text.textContent = currentQuizData.c;
    d_text.textContent = currentQuizData.d;
}




    function deselectAnswers() {
        answerEls.forEach(answerEl => answerEl.checked = false);
    }

    function getSelected() {
        let answer;
        answerEls.forEach(answerEl => {
            if (answerEl.checked) {
                answer = answerEl.id;
            }
        });
        return answer;
    }

    submitBtn.addEventListener("click", () => {
    const answer = getSelected();
    if (!answer) return;

    
    if (answered) {
        currentQuiz++;
        answered = false;
        submitBtn.innerText = "Submit";

        if (currentQuiz < quizData.length) {
            loadQuiz();
        } else {
            document.querySelector(".one").innerHTML = `
                <h2>You answered ${score} out of ${quizData.length} questions correctly</h2>
                <button class="restart-btn" onclick="location.reload()">Restart Quiz</button>
            `;
        }
        return;
    }

   
    answered = true;
    submitBtn.innerText = "Next";

    const correctAnswer = quizData[currentQuiz].correct;

    answerEls.forEach(el => {
        const label = document.getElementById(el.id + "_text");

        if (el.id === correctAnswer) {
            label.insertAdjacentHTML("beforeend", ` <span class="tick">✔</span>`);

            label.classList.add("correct");
        }

        if (el.checked && el.id !== correctAnswer) {
           label.insertAdjacentHTML("beforeend", ` <span class="tick">✖</span>`);

            label.classList.add("wrong");
        }

        el.disabled = true;
    });

    if (answer === correctAnswer) {
        score++;
        feedbackEl.innerHTML = `<p class="correct">Correct Answer ✔</p>`;
    } else {
        feedbackEl.innerHTML = `
    <p class="wrong">
        Wrong Answer ✖ <br>
        Correct Answer is: <b></b>
    </p>`;

feedbackEl.querySelector("b").textContent =
    quizData[currentQuiz][correctAnswer];

    }
});
    </script>
</body>
