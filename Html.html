<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML.QUIZ</title>
</head>

<body>

    <div class="onee">
        <div class="one">

          
                      <button id="home-btn" onclick="window.location.href='Home.html'">Home</button><br><br><br>
            <pre>  </pre>
            <h2 class="two">Welcome you here to attend the HTML Programming Language</h2>

            <h2 id="question" class="twoo">Question Text</h2>

            <ul class="options">
                <li>
                    <input type="radio" name="answer" id="a" class="answer">
                    <label for="a" id="a_text">Answer</label>

                </li>

                <li>
                    <input type="radio" name="answer" id="b" class="answer">
                    <label for="b" id="b_text">Answer</label>

                </li>

                <li>
                    <input type="radio" name="answer" id="c" class="answer">
                    <label for="c" id="c_text">Answer</label>

                </li>

                <li>
                    <input type="radio" name="answer" id="d" class="answer">
                    <label for="d" id="d_text">Answer</label>

                </li>
            </ul>

            <div id="feedback" class="feedback"></div>
            <button id="submit">Next</button>


        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "What does HTML stand for?",
                a: "Hyper Text Markup Language",
                b: "High Text Machine Language",
                c: "Hyperlinks and Text Markup Language",
                d: "Home Tool Markup Language",
                correct: "a"
            },
            {
                question: "Which tag is used to create a hyperlink?",
                a: "<link>",
                b: "<a>",
                c: "<href>",
                d: "<hyper>",
                correct: "b"

            },

            {
                question: "Which HTML tag is used to display an image?",
                a: "<image>",
                b: "<img>",
                c: "<src>",
                d: "<picture>",
                correct: "b"
            },

            {
                question: "Which tag is used for the largest heading?",
                a: "<h6>",
                b: "<head>",
                c: "<heading>",
                d: "<h1>",
                correct: "d"
            },

            {
                question: "What is the correct HTML element for a line break?",
                a: "<break>",
                b: "<lb>",
                c: "<br>",
                d: "<line>",
                correct: "c"
            },
            {
                question: "Which tag is used to create an unordered list?",
                a: "<ol>",
                b: "<ul>",
                c: "<li>",
                d: "<list>",
                correct: "b"
            },

            {
                question: "Which tag is used to create a table row?",
                a: "<td>",
                b: "<th>",
                c: "<tr>",
                d: "<table>",
                correct: "c"
            },

            {
                question: "Which attribute is used to provide an image description?",
                a: "title",
                b: "src",
                c: "alt",
                d: "href",
                correct: "c"
            },

            {
                question: "Which tag is used to make text bold?",
                a: "<bold>",
                b: "<b>",
                c: "<stronger>",
                d: "<bb>",
                correct: "b"
            },

            {
                question: "Which HTML element is used for user input?",
                a: "<form>",
                b: "<input>",
                c: "<textarea>",
                d: "<button>",
                correct: "b"
            },

            {
                question: "Which tag defines a checkbox?",
                a: "<checkbox>",
                b: "<input type='check'>",
                c: "<input type='checkbox'>",
                d: "<check>",
                correct: "c"
            },

            {
                question: "Which tag is used to define a form?",
                a: "<form>",
                b: "<input>",
                c: "<fieldset>",
                d: "<data>",
                correct: "a"
            },

            {
                question: "Which HTML tag is used to play video files?",
                a: "<media>",
                b: "<video>",
                c: "<movie>",
                d: "<mp4>",
                correct: "b"
            },
            {
                question: "Which attribute specifies the URL of a link?",
                a: "src",
                b: "link",
                c: "ref",
                d: "href",
                correct: "d"
            },
            {
                question: "Which tag is used to define the document title?",
                a: "<meta>",
                b: "<head>",
                c: "<title>",
                d: "<header>",
                correct: "c"
            }

        ];

        const questionEl = document.getElementById("question");
        const answerEls = document.querySelectorAll(".answer");
        const a_text = document.getElementById("a_text");
        const b_text = document.getElementById("b_text");
        const c_text = document.getElementById("c_text");
        const d_text = document.getElementById("d_text");
        const submitBtn = document.getElementById("submit");
        const feedbackEl = document.getElementById("feedback");

        let currentQuiz = 0;
        let score = 0;
        let answered = false;

        loadQuiz();



        function loadQuiz() {
            deselectAnswers();
            feedbackEl.innerHTML = "";

            answerEls.forEach(el => {
                el.disabled = false;
                const label = document.getElementById(el.id + "_text");
                label.classList.remove("correct", "wrong");
                label.querySelectorAll(".tick").forEach(tick => tick.remove());


            });

            const currentQuizData = quizData[currentQuiz];
            questionEl.innerText = currentQuizData.question;
            a_text.textContent = currentQuizData.a;
            b_text.textContent = currentQuizData.b;
            c_text.textContent = currentQuizData.c;
            d_text.textContent = currentQuizData.d;
        }




        function deselectAnswers() {
            answerEls.forEach(answerEl => answerEl.checked = false);
        }

        function getSelected() {
            let answer;
            answerEls.forEach(answerEl => {
                if (answerEl.checked) {
                    answer = answerEl.id;
                }
            });
            return answer;
        }

        submitBtn.addEventListener("click", () => {
            const answer = getSelected();
            if (!answer) return;


            if (answered) {
                currentQuiz++;
                answered = false;
                submitBtn.innerText = "Submit";

                if (currentQuiz < quizData.length) {
                    loadQuiz();
                } else {
                    document.querySelector(".one").innerHTML = `
                <h2>You answered ${score} out of ${quizData.length} questions correctly</h2>
                <button class="restart-btn" onclick="location.reload()">Restart Quiz</button>


                <br><br>
                      <button class="home-btn" onclick="window.location.href='Home.html'">Home</button>
            `;
                }
                return;
            }


            answered = true;
            submitBtn.innerText = "Next";

            const correctAnswer = quizData[currentQuiz].correct;

            answerEls.forEach(el => {
                const label = document.getElementById(el.id + "_text");

                if (el.id === correctAnswer) {
                    label.insertAdjacentHTML("beforeend", ` <span class="tick">✔</span>`);

                    label.classList.add("correct");
                }

                if (el.checked && el.id !== correctAnswer) {
                    label.insertAdjacentHTML("beforeend", ` <span class="tick">✖</span>`);

                    label.classList.add("wrong");
                }

                el.disabled = true;
            });

            if (answer === correctAnswer) {
                score++;
                feedbackEl.innerHTML = `<p class="correct">Correct Answer ✔</p>`;
            } else {
                feedbackEl.innerHTML = `
    <p class="wrong">
        Wrong Answer ✖ <br>
        Correct Answer is: <b></b>
    </p>`;

                feedbackEl.querySelector("b").textContent =
                    quizData[currentQuiz][correctAnswer];

            }
        });

    </script>
</body>
